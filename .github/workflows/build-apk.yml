name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak ZIP bila proyek diunggah sebagai .zip
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir _src && unzip -o *.zip -d _src
            cp -r _src/*/. . 2>/dev/null || cp -r _src/. .
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pakai keystore tetap (bila ada) agar update bisa menimpa versi lama
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; fi
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pembaca-novel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rilis APK (link unduhan langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
